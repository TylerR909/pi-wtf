server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Edge / browser cache: hashed assets forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker + workbox runtime must revalidate
    location ~* (sw\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Crawler files — short TTL so copy/sitemap edits reach the edge
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        default_type text/plain;
        try_files $uri =404;
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
        default_type application/xml;
        try_files $uri =404;
    }
    location = /llms.txt {
        add_header Cache-Control "public, max-age=86400";
        default_type text/plain;
        try_files $uri =404;
    }
    location = /learn {
        add_header Cache-Control "public, max-age=86400";
        try_files /learn.html =404;
    }
    location = /learn.html {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location = /og.jpg {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location = /LICENSE {
        add_header Cache-Control "public, max-age=86400";
        default_type text/plain;
        try_files $uri =404;
    }
    location = /THIRD_PARTY_NOTICES.md {
        add_header Cache-Control "public, max-age=86400";
        default_type text/plain;
        try_files $uri =404;
    }

    # Everything else is the SPA shell
    location / {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # gzip static
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
